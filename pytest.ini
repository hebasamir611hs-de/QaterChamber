# -n 3 is the current starting point for parallel execution (pytest-xdist),
# not a ceiling — raise it by editing this value, or override per invocation
# with `pytest -n auto` / `-n <count>`. (Comment re-synced with the actual
# value 2026-08-18 — it previously said "-n 2" while addopts carried -n 3.)
# NOTE: against the shared qcdev instance, parallel authenticated sessions
# are a suspected aggravator of the "developer mode connection limit"
# interstitial (core/web/license_gate.py) — if the gate fires often, try
# `-n 1` before adding more gate-tolerance machinery.
addopts = -ra -n 3 --dist loadgroup --alluredir=reports/allure-results --clean-alluredir
# `mobile` is intentionally absent — no mobile surface is scaffolded on this
# project yet. Listing a non-existent directory here makes every pytest
# invocation error out during collection. Add it back when mobile/ exists.
testpaths = web cms
# The framework sits AT the project root, so rootdir is the whole project and
# a bare `pytest .` would walk the QA-engine and tooling folders too. Prune
# them explicitly — testpaths only bounds the DEFAULT invocation, not an
# explicit path argument or IDE test discovery.
norecursedirs = .* reports node_modules __pycache__ *.egg-info
python_files = test_*.py
python_classes = Test*
python_functions = test_*
