[pytest]
# Axis 1 (Lifecycle) and Axis 3 (Platform) markers are seeded now — every
# value valid across projects. Axis 2 (Service/Module), Axis 4 (Category),
# Axis 5 (Business keyword), and Axis B (pbi_<id> backlog traceability) are
# project-specific: automate-test-case registers each one here the first
# time it authors a test that needs it, so this list always matches what's
# actually applied in code. See automation-standards.md's marker table.
markers =
    regression: critical re-run subset (mirrors the Regression QA tag) — a subset of the automated suite, not all of it
    web: public web surface (mirrors Platform=Web)
    ios: iOS app surface (mirrors Platform=IOS)
    android: Android app surface (mirrors Platform=Android)
    control_panel: control-panel surface (mirrors Platform=Control_Panel)
    traceability: QA traceability ID this test maps back to, e.g. @pytest.mark.traceability("TAG-TOPUP-TC-014")
    # pytest-xdist's own marker (self-registered by the plugin; listed here
    # only for documentation) -- @pytest.mark.xdist_group("<name>") pins a
    # test to a named group so --dist loadgroup never schedules two tests
    # sharing a group on different workers concurrently. Applied only to
    # tests that mutate one of this project's 4 shared/singleton qcdev
    # records -- see standards.md's "Execution Process Conventions" section
    # for the exact group names and which tests carry them.
    # Axis 2 (Service/Module) — registered by automate-test-case on first use.
    global_: GLOBAL service/module scope (mirrors the GLOBAL QA tag). Named
        with a trailing underscore because "global" is a Python keyword and
        cannot follow a dot (@pytest.mark.global is a SyntaxError).
    about: ABOUT service/module scope (mirrors the ABOUT QA tag — About Us,
        Chairman's Message, Laws, Vision/Mission, GM's Message, Board, Org Structure)
    media: MEDIA service/module scope (mirrors the MEDIA QA tag — News, Media
        Gallery, Podcast, Publications)
    expo: EXPO service/module scope (mirrors the EXPO QA tag — PBI 130953
        "QC - Events - 006 - Made in China Expo"; distinct from the existing
        cross-cutting `event` keyword below, which mirrors a different tag)
    invest: INVEST service/module scope (mirrors the INVEST QA tag — Invest in
        Qatar / Business Gateway: Qatar at a Glance, Economic Laws, Visas,
        Investment, Business Opportunities, Business Owners Platform, Tenders)
    # Axis 4 (Category) — registered by automate-test-case on first use.
    functional_low: mirrors the Functional-Low QA category tag
    functional_high: mirrors the Functional-High QA category tag
    ui: mirrors the UI QA category tag
    edge: mirrors the Edge QA category tag
    auth: mirrors the Auth QA category tag
    compatibility: mirrors the Compatibility QA category tag
    # Axis 5 (Business keyword) — registered by automate-test-case on first use.
    bilingual: cross-cutting EN/AR bilingual-field selector (mirrors the Bilingual QA tag)
    redirect: cross-cutting external-redirect/Open-Behavior selector (mirrors the Redirect QA tag)
    newsletter: cross-cutting footer-newsletter selector (mirrors the Newsletter QA tag)
    accessibility: cross-cutting accessibility-widget selector (mirrors the Accessibility QA tag)
    rtl: cross-cutting RTL/mirroring selector (mirrors the RTL QA tag)
    dataintegrity: cross-cutting data-integrity/consistency selector (mirrors the DataIntegrity QA tag)
    b2b: cross-cutting B2B Platform widget selector (mirrors the B2B QA tag)
    marhaba: cross-cutting Marhaba Guide widget selector (mirrors the Marhaba QA tag)
    weather: cross-cutting Weather widget selector (mirrors the Weather QA tag)
    event: cross-cutting Events/Business Events widget selector (mirrors the EVENT QA tag)
    workflow: cross-cutting content-workflow selector (mirrors the Workflow QA tag — Draft/Submit for Review/Publish/Unpublish transitions)
    svc: cross-cutting Our Services section selector (mirrors the SVC QA tag — Home Page "Our Services" filter tabs / service cards)
    uat: cross-cutting User Acceptance Testing selector (mirrors the UAT QA tag)
    webform: cross-cutting public-webform selector (mirrors the Webform QA tag — e.g. Request to the Media Dept.'s Interview/Event Coverage/Media Inquiry forms)
    socialmedia: cross-cutting Social Media Icons selector (mirrors the SocialMedia QA tag)
