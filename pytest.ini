    regression: critical re-run subset (mirrors the Regression QA tag) — a subset of the automated suite, not all of it
    web: public web surface (mirrors Platform=Web)
    ios: iOS app surface (mirrors Platform=IOS)
    android: Android app surface (mirrors Platform=Android)
