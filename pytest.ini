    regression: critical re-run subset (mirrors the Regression QA tag) — a subset of the automated suite, not all of it
    web: public web surface (mirrors Platform=Web)
    ios: iOS app surface (mirrors Platform=IOS)
    android: Android app surface (mirrors Platform=Android)
    control_panel: control-panel surface (mirrors Platform=Control_Panel)
    traceability: QA traceability ID this test maps back to, e.g. @pytest.mark.traceability("TAG-TOPUP-TC-014")
    # pytest-xdist's own marker (self-registered by the plugin; listed here
    # only for documentation) -- @pytest.mark.xdist_group("<name>") pins a
    # test to a named group so --dist loadgroup never schedules two tests
    # sharing a group on different workers concurrently. Applied only to
    # tests that mutate one of this project's 4 shared/singleton qcdev
    # records -- see standards.md's "Execution Process Conventions" section
    # for the exact group names and which tests carry them.
    # Axis 2 (Service/Module) — registered by automate-test-case on first use.
    global_: GLOBAL service/module scope (mirrors the GLOBAL QA tag). Named
        with a trailing underscore because "global" is a Python keyword and
        cannot follow a dot (@pytest.mark.global is a SyntaxError).
    about: ABOUT service/module scope (mirrors the ABOUT QA tag — About Us,
        Chairman's Message, Laws, Vision/Mission, GM's Message, Board, Org Structure)
